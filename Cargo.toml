[package]
name = "rulesteward"
version = "0.6.0"
edition = "2024"
description = "audit2why/audit2allow for host policy systems; fapolicyd is the first domain"
repository = "https://github.com/rulesteward/rulesteward"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4", features = ["derive"] }

[build-dependencies]
# build.rs renders the man page and the bash completion from src/cli.rs (#79).
# Build-only: none of it links into the shipped binary.
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.2"
clap_complete = "4"

[dev-dependencies]
# Bounded property testing on the parser. Dev-only: never in the shipped binary.
proptest = "1.11"
# Snapshot assertions for the golden tests. Dev-only: never in the shipped binary.
insta = { version = "1.48", features = ["glob"] }

[features]
# Sweeps the full 121-log corpus through the gitignored `research` symlink.
# Off by default: the corpus lives in the private rulesteward-research repo.
full-corpus = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# DESIGN.md section 3: diagnostics are returned as data, never printed. Deny, not
# forbid, so the single sanctioned output site in main.rs can allow it locally.
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
strip = true

# cargo-mutants rebuilds lib, bin and every test binary once per mutant, and
# nothing debugs a mutant, so the debug info is pure rebuild cost.
[profile.mutants]
inherits = "test"
debug = "none"
