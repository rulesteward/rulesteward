[package]
name = "rulesteward-core"
description = "Shared types (diagnostics, severity, AST) for the RuleSteward toolkit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
# Unix `fcntl` (F_GETFL/F_SETFL) for `fsread::read_stream_to_string`'s FIFO
# live-writer path (#583/#561): clearing O_NONBLOCK after the type
# check is a real syscall, not a hardcodable platform constant. Already a
# normal (non-dev) transitive dependency of this workspace via
# heed -> lmdb-master-sys (see the workspace Cargo.toml comment), so this adds
# no new code to the musl static binary.
libc = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
