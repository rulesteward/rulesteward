[package]
name = "rulesteward-sudoers"
description = "sudoers(5) parser and security-baseline linter for RuleSteward."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
rulesteward-core = { workspace = true }
# The differential corpus is one JSON document per (scenario, target),
# because two of the four oracle results already ARE JSON ASTs emitted by
# `cvtsudoers -f json`.
#
# A regular dependency rather than a dev-dependency because src/oracle.rs holds
# the model, the fail-closed parse and the compare. Keeping that in src/ is what
# subjects it to `just ci` clippy, the coverage floor and the mutation gate; a
# tests/-only or feature-gated home would silently drop all three. serde_json is
# already in the workspace graph (the SARIF renderer), so this adds no new
# supply-chain surface.
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
