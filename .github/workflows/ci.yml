name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel, the components and the musl target.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No musl-tools install: rustc's self-contained musl links this tree, which is
      # pure Rust plus clap. Verified locally on 2026-09-06 with no .cargo/config.toml
      # and no musl-gcc involved. If a C-linking dependency ever lands, this job is
      # where it will show up first.
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: the binary must be static
        run: |
          ldd target/x86_64-unknown-linux-musl/release/rulesteward 2>&1 \
            | grep -q 'statically linked'
