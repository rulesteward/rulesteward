# Pinned DISA STIG XCCDF zips for the sudo-W04 control-id drift check.
#
# DISA versions each RHEL STIG by FILENAME (there is no releases/latest API like
# ComplianceAsCode has), so a bump = edit the `zip` filename below, then run
# `sudoers-stig-update derive --product <p>`, review the diff, update
# crates/rulesteward-sudoers/src/lints/stig.rs (`PW_FAMILY_CONTROLS` /
# `AUTHENTICATE_CONTROLS` / `TIMESTAMP_TIMEOUT_CONTROLS`), re-gate (adversarial +
# mutation), and confirm `sudoers-stig-update check` reports 0 drift.
#
# CURRENCY NOTE (updated 2026-07-24, post-adversarial-review round 3): the
# initial test-author pass pinned V2R4/V2R7/V1R1 (the revisions cached locally
# and used to build the committed fixtures) and left bumping to V2R8/V2R9/V1R2
# as a follow-up, since sshd/auditd's own live pins had since moved there.
#
# What is actually verified, and by whom:
# - All NINE sudo-W04 ids (AUTHENTICATE_CONTROLS / PW_FAMILY_CONTROLS /
#   TIMESTAMP_TIMEOUT_CONTROLS across RHEL-08/09/10) and the three per-product
#   NOPASSWD decoy Groups are confirmed BYTE-IDENTICAL between the old and new
#   revisions -- verified by an independent adversarial review pass
#   (2026-07-24, round 1).
# - rhel8's V-230221 (one of the 3 wholly-unrelated Groups) is ALSO confirmed
#   byte-identical between revisions -- same review pass, round 3.
# - rhel8's V-230222 and V-230223 (the other 2 wholly-unrelated Groups) are
#   NOT identical between V2R4 and V2R8 (round-3 review finding: both Rule ids
#   changed; V-230222's check-content gained a leading applicability note;
#   V-230223's title/fixtext/check-content were rewritten entirely, unrelated
#   to sudo either way). Rather than leave the committed fixture mixing a
#   stale V2R4 copy with the pinned V2R8 revision, both Groups were
#   RE-EXTRACTED fresh from the actual V2R8 XCCDF (this lane, round 3) so
#   `tests/fixtures/rhel8_sudoers_controls.xml` is now what its own
#   description claims: genuinely V2R8 content throughout. Neither revision
#   of either Group contains any sudo-W04 keyword, so their role (a Group a
#   correct selector must exclude) is unaffected either way.
#
# This pin matches tools/sshd-stig-update / tools/auditd-stig-update's current
# live pin, and the committed tests/fixtures/rhelN_sudoers_controls.xml are
# accurate, verbatim extracts of these CURRENT pinned revisions -- see
# tests/fixtures/README.md for the full per-Group provenance.
#
# The public, no-auth CDN. Full URL = base_url + "/" + products.<p>.zip.
# (public.cyber.mil/stigs/downloads/ is a JavaScript SPA that curl cannot read;
# dl.dod.cyber.mil is the machine-fetchable path.)
base_url = "https://dl.dod.cyber.mil/wp-content/uploads/stigs/zip"

# Per-product pinned zip. The three RHEL STIGs version INDEPENDENTLY, so each has
# its own pinned filename and can be bumped on its own. Same three revisions
# tools/sshd-stig-update/stig-refs.toml and tools/auditd-stig-update/stig-refs.toml
# pin (the sshd/auditd/sudoers baselines are all drawn from the same three
# benchmark documents).
[products.rhel8]
zip = "U_RHEL_8_V2R8_STIG.zip"
benchmark = "RHEL 8 STIG V2R8 (01 Jul 2026)"

[products.rhel9]
zip = "U_RHEL_9_V2R9_STIG.zip"
benchmark = "RHEL 9 STIG V2R9 (01 Jul 2026)"

[products.rhel10]
zip = "U_RHEL_10_V1R2_STIG.zip"
benchmark = "RHEL 10 STIG V1R2 (01 Jul 2026)"
